<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sreerag — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  :root{
    --paper:#F8F7F6; --ink:#1A1A18; --ink-soft:#5B5B57; --signal:#2149C4;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--paper); overflow:hidden; overscroll-behavior:none; touch-action:none; }
  body{ font-family:'Space Grotesk', sans-serif; }

  #stage{ position:fixed; top:0;right:0;bottom:0;left:0; z-index:1; }
  #stage canvas{ display:block; }

  #antLayer{ position:fixed; top:0;right:0;bottom:0;left:0; z-index:2; pointer-events:none; }

  .spacer{ position:relative; z-index:0; }

  .hint{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.08em;
    color:var(--ink-soft); z-index:5; display:flex; flex-direction:column; align-items:center; gap:6px;
    transition:opacity 0.4s ease; pointer-events:none;
  }
  .hint .chev{ animation:bob 1.6s ease-in-out infinite; font-size:14px; }
  @keyframes bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(6px); } }

  .loading{
    position:fixed; top:0;right:0;bottom:0;left:0; z-index:10; background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);
    letter-spacing:0.08em; transition:opacity 0.5s ease;
  }

  footer.end{ position:relative; z-index:0; padding:14vh 8vw 12vh; text-align:center; }
  footer.end .mono{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); }

  @media (prefers-reduced-motion: reduce){ .hint .chev{ animation:none; } }

  /* ── MOBILE SCREEN (< 768px): hide book, show paper card ── */
  #mobile-screen{
    display: none;
    position: fixed; top:0;right:0;bottom:0;left:0; z-index: 9999;
    background: #F8F7F6;
    align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* Ambient background warmth gradient */
  #mobile-screen::before{
    content:''; position:absolute; top:0;right:0;bottom:0;left:0; pointer-events:none;
    background:
      radial-gradient(ellipse at 35% 25%, rgba(255,250,235,0.55) 0%, transparent 55%),
      radial-gradient(ellipse at 68% 78%, rgba(215,205,180,0.22) 0%, transparent 55%);
  }
  /* Hyper-realistic paper card */
  #mobile-page-card{
    position: relative;
    width: 81.4vw;
    max-width: 341px;
    aspect-ratio: 3 / 4;
    border-radius: 1px 2px 2px 1px;
    overflow: hidden;
  }
  #mobile-page-card img{
    width:100%; height:100%; object-fit:cover;
    display:block; position:relative; z-index:1;
  }
  /* Paper grain overlay */
  #mobile-page-card .m-grain{
    position:absolute; top:0;right:0;bottom:0;left:0; z-index:2; pointer-events:none;
    opacity:0.038; mix-blend-mode:multiply;
    background-color:#7A6E58;
    filter:url(#mobileGrain);
  }

  @media (max-width: 767px){
    #mobile-screen{ display: flex; }
    #stage, #antLayer, .hint, #chapterTabs,
    #scanOverlay, #handContainer, #handDismiss,
    #nowPlaying, .loading, .spacer, footer.end{ display: none !important; }
  }


  .chapter-tabs{
    position:fixed; right:0; top:50%; transform:translateY(-50%);
    z-index:15; display:flex; flex-direction:column; gap:3px;
  }
  .chapter-tab{
    font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:0.09em;
    writing-mode:vertical-rl; text-orientation:mixed;
    background:#EAE6D9; color:#5B5B57; border:1px solid #D3CDB9; border-right:none;
    padding:14px 6px; cursor:pointer; border-radius:3px 0 0 3px;
    box-shadow:-2px 2px 5px rgba(20,19,15,0.10);
    transition:transform 0.18s ease, background 0.18s ease, color 0.18s ease, padding-right 0.18s ease;
  }
  .chapter-tab:hover{
    transform:translateX(-5px);
    background:#F1EEE1; color:#1A1A18;
  }
  .chapter-tab.active{
    background:#1A1A18; color:#F1EEE5; border-color:#1A1A18;
    padding-right:10px;
  }
  @media (max-width:640px){
    .chapter-tab{ font-size:9px; padding:10px 5px; }
  }

  /* ── SCAN button ─────────────────────────────────── */
  #scanOverlay{
    position:fixed; bottom:6vh; left:50%; transform:translateX(-50%);
    z-index:10; pointer-events:none; opacity:0;
    white-space:nowrap; }
  #scanBtn{
    background:transparent; color:rgba(26,26,24,0.6);
    border:1.5px solid rgba(26,26,24,0.3);
    font:600 12px "IBM Plex Mono",monospace;
    letter-spacing:0.18em; padding:13px 36px;
    cursor:pointer; border-radius:2px;
    transition:background 0.2s, color 0.2s, border-color 0.2s; }
  #scanBtn:hover{ background:rgba(26,26,24,0.88); color:#F1EEE5; border-color:rgba(26,26,24,0.88); }

  /* ── Hand scanning container ─────────────────────── */
  /* JS sets left+top to align phone screen over the QR code via Three.js projection */
  #handContainer{
    position:fixed;
    top:0; left:0;           /* overridden by JS */
    width:min(70vw, 720px);
    aspect-ratio: 9913 / 13909;
    z-index:20; pointer-events:none;
    transform:translateY(130vh); /* starts below screen */
    will-change:transform; }
  #handContainer.scanning{
    animation:
      handArrive 0.7s cubic-bezier(0.22,1,0.36,1) forwards,
      handHover  3.2s 0.7s ease-in-out infinite; }
  #handContainer.departing{
    animation: handLeave 0.5s cubic-bezier(0.55,0,1,0.45) forwards; }
  @keyframes handArrive{
    from{ transform:translateY(130vh); }
    to  { transform:translateY(0);     }
  }
  @keyframes handHover{
    0%,100%{ transform:translateY(0); }
    50%     { transform:translateY(-10px); }
  }
  @keyframes handLeave{
    from{ transform:translateY(0); }
    to  { transform:translateY(130vh); }
  }
  /* The real photo — mix-blend-mode:screen removes pure-black bg,
     so the book-page QR code shows THROUGH the phone screen naturally */
  #handImg{
    width:100%; display:block;
    pointer-events:none; }
  /* Camera-app viewfinder overlay, positioned over the phone screen area
     in the photo (screen occupies ≈ left:21%, top:13%, w:51%, h:40%) */
  #phoneFx{
    position:absolute;
    top:20.7%; left:37.5%; width:27.0%; height:39.7%;
    pointer-events:none; overflow:hidden; }
  #musicPlayer.active{ pointer-events:auto; }
  #musicPlayer.active .mp-btn{ pointer-events:auto; cursor:pointer; }
  /* realistic camera QR scanner screen */
  #scanUI{
    position:absolute; top:0;right:0;bottom:0;left:0;
    background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0.18) 22%,rgba(0,0,0,0.18) 75%,rgba(0,0,0,0.55) 100%);
    display:flex; flex-direction:column;
    font-family:system-ui,-apple-system,sans-serif; color:#fff; }
  #scanUI-statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:4% 6% 0; font-size:7px; opacity:.8; flex-shrink:0; letter-spacing:.05em; }
  #scanUI-clock{
    display:flex; flex-direction:column; align-items:center;
    padding:1% 0 0; flex-shrink:0; }
  #scanUI-clocktime{
    font-size:22px; font-weight:200; letter-spacing:.02em; line-height:1; }
  #scanUI-clockdate{
    font-size:7px; opacity:.7; margin-top:2px; letter-spacing:.06em; }
  #scanUI-date{
    text-align:center; font-size:7px; opacity:.72;
    letter-spacing:.05em; padding:1% 0 0; flex-shrink:0; }
  #scanUI-label{
    text-align:center; font-size:6.5px; letter-spacing:.14em;
    text-transform:uppercase; opacity:.85;
    padding:2% 0 3%; flex-shrink:0; }
  #scanUI-vf{
    flex:1; position:relative; min-height:0; margin:0 8%; }
  .vf-corner{
    position:absolute; width:13px; height:13px;
    border:2px solid rgba(255,255,255,0.92); }
  .vf-tl{ top:0; left:0;   border-right:none; border-bottom:none; }
  .vf-tr{ top:0; right:0;  border-left:none;  border-bottom:none; }
  .vf-bl{ bottom:0; left:0;  border-right:none; border-top:none; }
  .vf-br{ bottom:0; right:0; border-left:none;  border-top:none; }
  #scanLine{
    position:absolute; left:0; right:0; height:1.5px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.75) 30%,rgba(255,255,255,.75) 70%,transparent);
    box-shadow:0 0 5px rgba(255,255,255,.45);
    animation:phoneScan 1.8s ease-in-out infinite; }
  @keyframes phoneScan{
    0%  { top:0;    opacity:0; }
    6%  { opacity:1; }
    94% { opacity:1; }
    100%{ top:100%; opacity:0; }
  }
  #scanUI-bottom{
    display:flex; justify-content:space-between; align-items:center;
    padding:4% 14% 6%; flex-shrink:0; }
  .scanUI-hw-btn{
    background:rgba(255,255,255,0.18); border:none; border-radius:50%;
    width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    color:#fff; cursor:default; padding:0; }
  /* "scanned!" flash */
  #scanFlash{
    position:absolute; top:0;right:0;bottom:0;left:0;
    background:rgba(255,255,255,0.55);
    opacity:0; pointer-events:none; transition:opacity 0.15s; }
  #scanFlash.on{ opacity:1; }
  /* dismiss tap zone (invisible, covers hand) */
  #handDismiss{
    position:fixed; left:50%; bottom:0;
    width:min(50vw,520px); height:80vh;
    z-index:21; cursor:pointer; display:none; }
  #handDismiss.active{ display:block; }
  /* now-playing pill */
  #nowPlaying{
    position:fixed; bottom:6vh; left:50%; transform:translateX(-50%);
    background:transparent; color:rgba(26,26,24,0.6);
    border:1.5px solid rgba(26,26,24,0.3);
    font:600 11px "IBM Plex Mono",monospace;
    letter-spacing:0.16em; padding:11px 28px;
    border-radius:2px; z-index:22;
    opacity:0; transition:opacity 0.4s, background 0.2s, color 0.2s, border-color 0.2s;
    white-space:nowrap; pointer-events:none; }
  #nowPlaying.show{ opacity:1; pointer-events:auto; }
  #nowPlaying.show:hover{ background:rgba(26,26,24,0.88); color:#F1EEE5; border-color:rgba(26,26,24,0.88); }

  
  
  /* ── Music Player ──────────────────────────────────── */
  #musicPlayer{
    display:none; flex-direction:column;
    position:absolute; top:0;right:0;bottom:0;left:0;
    background:linear-gradient(180deg,#2c2c2c 0%,#1a1a1a 100%);
    border-radius:4px;
    overflow:hidden;
    font-family:system-ui,-apple-system,sans-serif;
    color:#fff;
    padding:0;
  }
  #musicPlayer.active{ display:flex; pointer-events:auto; }
  #musicPlayer.active .mp-btn{ pointer-events:auto; cursor:pointer; }

  /* Status bar */
  #mp-statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:3% 5% 1%; font-size:8px; opacity:.6; flex-shrink:0;
  }

  /* Nav bar */
  #mp-navbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 5% 2%; font-size:9px; font-weight:700; flex-shrink:0;
  }
  #mp-back{ cursor:pointer; font-size:11px; opacity:.7; }

  /* Album art — grows to fill space between nav and info */
  #mp-art{
    flex:1; min-height:0;
    display:flex; align-items:center; justify-content:center;
    padding:4% 0;
  }
  #mp-art-circle{
    width:60%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#555,#2a2a2a);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
    animation:mpSpin 8s linear infinite paused;
    flex-shrink:0;
  }
  #mp-art-circle svg{ width:45%; height:45%; opacity:.85; }
  #musicPlayer.playing #mp-art-circle{ animation-play-state:running; }
  @keyframes mpSpin{ to{ transform:rotate(360deg); } }

  /* Song info */
  #mp-info{
    text-align:center; padding:0 8% 3%; flex-shrink:0;
  }
  #mp-title{ font-size:10px; font-weight:700; margin-bottom:2px; }
  #mp-sub  { font-size:7px;  opacity:.4; }

  /* Progress */
  #mp-progress-wrap{ padding:0 8% 2%; flex-shrink:0; }
  #mp-progress-bar{
    position:relative; width:100%; height:2px;
    background:rgba(255,255,255,.2); border-radius:2px;
    cursor:pointer; margin-bottom:3px; pointer-events:auto;
  }
  #mp-progress-fill{
    height:100%; width:0%; border-radius:2px;
    background:#fff; pointer-events:none;
  }
  #mp-progress-dot{
    position:absolute; top:50%;
    left:0%;
    width:8px; height:8px;
    background:#fff; border-radius:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  #mp-times{
    display:flex; justify-content:space-between;
    font-size:6px; opacity:.45;
  }

  /* Controls — bottom */
  #mp-controls{
    display:flex; justify-content:center; align-items:center;
    gap:10%; padding:2% 12% 6%;
    flex-shrink:0;
  }
  .mp-btn{
    background:none; border:none;
    padding:0; display:flex; align-items:center; justify-content:center;
    color:#fff; opacity:.85; -webkit-tap-highlight-color:transparent;
  }
  .mp-btn svg{ width:18px; height:18px; display:block; }
  .mp-playbtn{
    background:rgba(255,255,255,.12);
    border-radius:50%;
    padding:8px;
    border:1px solid rgba(255,255,255,.25);
    opacity:1;
  }
  .mp-playbtn svg{ width:20px; height:20px; }

  </style>
</head>
<body>

<!-- Mobile screen — shown only on phones (< 768px), replaces the book -->
<!-- SVG grain filter for paper texture (hidden, referenced by CSS) -->
<svg width="0" height="0" style="position:absolute;pointer-events:none">
  <defs>
    <filter id="mobileGrain" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72 0.68" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="multiply"/>
    </filter>
  </defs>
</svg>
<div id="mobile-screen">
  <div id="mobile-page-card">
    <img src="assets/images/mobile-page.webp" alt="Portfolio — Sreerag">
    <div class="m-grain"></div>
  </div>
</div>

<div class="loading" id="loading">PREPARING THE BOOK&hellip;</div>
<div id="stage"></div>
<canvas id="antLayer" aria-hidden="true"></canvas>
<div class="hint" id="hint"><span>SCROLL TO OPEN</span><span class="chev">&#8595;</span></div>

<nav class="chapter-tabs" id="chapterTabs"></nav>


<div id="scanOverlay">
  <button id="scanBtn" onclick="triggerScan()">&#9654;&nbsp; SCAN</button>
</div>

<div id="handContainer">
  <div id="phoneFx">
    <!-- Scanner UI -->
    <div id="scanUI">
      <!-- status bar -->
      <div id="scanUI-statusbar">
        <span id="scanUI-time">9:41</span>
        <span>&#9646;&#9646;&#9646;&thinsp;&#9650;</span>
      </div>
      <div id="scanUI-date">Sunday, 23 Aug</div>
      <!-- label -->
      <div id="scanUI-label">Find a QR Code</div>
      <!-- viewfinder box -->
      <div id="scanUI-vf">
        <div class="vf-corner vf-tl"></div>
        <div class="vf-corner vf-tr"></div>
        <div class="vf-corner vf-bl"></div>
        <div class="vf-corner vf-br"></div>
        <div id="scanLine"></div>
      </div>
      <!-- bottom toolbar -->
      <div id="scanUI-bottom">
        <button class="scanUI-hw-btn" title="Torch">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </button>
        <button class="scanUI-hw-btn" title="Gallery">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
      </div>
      <div id="scanFlash"></div>
    </div>
    <!-- Music Player UI (shown after scan) -->
    <div id="musicPlayer">
      <div id="mp-statusbar">
        <span id="mp-statusbar-time">12:00</span>
        <span>&#9646;&#9646;&#9646; &#9650;</span>
      </div>
      <div id="mp-navbar">
        <span id="mp-back" onclick="window.closeHandOverlay()" style="cursor:pointer">&#8592;</span>
        <span id="mp-navtitle">Music Player</span>
        <span id="mp-close" onclick="window.closeHandOverlay()" style="cursor:pointer;opacity:.7">&#10005;</span>
      </div>
      <div id="mp-art">
        <div id="mp-art-circle">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 18V6l12-2v12" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="6" cy="18" r="3" stroke="white" stroke-width="1.8"/>
            <circle cx="18" cy="16" r="3" stroke="white" stroke-width="1.8"/>
          </svg>
        </div>
      </div>
      <div id="mp-info">
        <div id="mp-title">Sreerag KS</div>
        <div id="mp-sub">Portfolio Audio</div>
      </div>
      <div id="mp-progress-wrap">
        <div id="mp-progress-bar">
          <div id="mp-progress-fill"></div>
          <div id="mp-progress-dot"></div>
        </div>
        <div id="mp-times">
          <span id="mp-cur">0:00</span>
          <span id="mp-dur">0:00</span>
        </div>
      </div>
      <div id="mp-controls">
        <button class="mp-btn" id="mp-prev-btn" onclick="window.mpPrev()">
          <svg viewBox="0 0 24 24" fill="white"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="mp-btn mp-playbtn" id="mp-playbtn" onclick="window.mpToggle()">
          <svg id="mp-play-icon" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          <svg id="mp-pause-icon" viewBox="0 0 24 24" fill="white" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="mp-btn" id="mp-next-btn" onclick="window.mpNext()">
          <svg viewBox="0 0 24 24" fill="white"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
    </div>
    </div>
  <img id="handImg" src="assets/images/hand.webp" alt=""/>
</div>
<div id="handDismiss" onclick="window.closeHandOverlay()"></div>
<div id="nowPlaying" onclick="window.closeHandOverlay()" style="cursor:pointer">&#10005;&#160;&#160;CLOSE</div>
<audio id="bookAudio" src="assets/audio/music.mp3" preload="none"></audio>

<div class="spacer" id="spacer"></div>
<footer class="end"><p class="mono">END OF BOOK — SCROLL UP TO READ AGAIN</p></footer>

<script>
(function(){

  // Skip all Three.js / book init on mobile — the #mobile-screen div handles it
  if(window.innerWidth < 768){ return; }

  // Safari/CDN guard: if three.js failed to load, bail out cleanly
  if(typeof THREE === 'undefined'){
    var _ld=document.getElementById('loading');
    if(_ld){_ld.style.opacity='0';setTimeout(function(){_ld.style.display='none';},500);}
    return;
  }

  // ---------- content ----------
  var PAGES = [
    { front: {}, back: {} },  // leaf 0  — cover
    { front: {}, back: {} },  // leaf 1  — page-01 / page-02
    { front: {}, back: {} },  // leaf 2  — page-03 / page-04
    { front: {}, back: {} },  // leaf 3  — page-3a / page-3b  ← NEW
    { front: {}, back: {} },  // leaf 4  — page-05 / page-06
    { front: {}, back: {} },  // leaf 5  — page-07 / page-08
    { front: {}, back: {} },  // leaf 6  — page-09 / page-10
    { front: {}, back: {} },  // leaf 7  — page-11 / page-12
    { front: {}, back: {} },  // leaf 8  — page-13 / page-14
    { front: {}, back: {} },  // leaf 9  — page-15 / page-16
    { front: {}, back: {} },  // leaf 10 — page-17 / page-18
    { front: {}, back: {} },  // leaf 11 — page-19 / page-20
    { front: {}, back: {} },  // leaf 12 — page-21 / page-22
    { front: {}, back: {} },  // leaf 13 — page-23 / page-24
    { front: {}, back: {} },  // leaf 14 — page-25 / page-26
    { front: {}, back: {} },  // leaf 15 — page-27 / page-28
    { front: {}, back: {} },  // leaf 16 — page-29 / QR (page-30)
    { front: {}, back: {} },  // leaf 17 — page-31 / page-32
    { front: {}, back: {} }   // leaf 18 — back cover
  ];

  var L = PAGES.length;
  var PAUSE = 0.6;
  var TOTAL_UNITS = L + PAUSE * 2;
  var EASE = 0.15;
  var EASE_COVER = 0.22;
  var SEG_X = 32;
  var PAGE_W = 1.5;
  var PAGE_H = 2.0;
  var BEND_AMP = 0.26;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- wind breeze: idle-triggered paper flutter ----------
  // Only kicks in once the visitor has left the page alone for a while --
  // the book shouldn't ever fidget while someone is actually scrolling or
  // reading. Any real interaction (scroll, click, drag, key, touch) resets
  // the idle clock immediately and fades an in-progress gust out fast.

      var targetStrength = 0;
      if(breeze.active){
        var e = (breezeNow - breeze.startTime) / 1000;
        var fadeIn = Math.min(1, e / 0.9);
        var fadeOut = Math.min(1, (breeze.duration - e) / 1.2);
        targetStrength = Math.max(0, Math.min(fadeIn, fadeOut));
      }
      breeze.strength = lerp(breeze.strength, targetStrength, 0.08);
    }
    var breezeTime = breezeNow / 1000;

    var turnArc = 0, turnC = 0.5;
    leaves.forEach(function(g, i){
      var s = state[i];
      var ease = reduceMotion ? 1 : (g.userData.isCover ? EASE_COVER : EASE);
      s.current = lerp(s.current, s.target, ease);

      var delta = s.current - s.prev;
      if(Math.abs(delta) > 0.0004){
        s.dir = delta > 0 ? 1 : -1;
      }
      s.prev = s.current;

      var arc = Math.sin(s.current * Math.PI);
      // Track whichever leaf is actively mid-turn right now (the one with
      // the largest arc value) so the moving turn-shadow below can follow
      // it -- at rest every leaf sits at c=0 or c=1 where arc is 0, so this
      // stays inert except during an actual flip.
      if(arc > turnArc){
        turnArc = arc;
        turnC = s.current;
      }
    });

    // ---- which leaf is the live boundary between the two stacks ----
    // Recomputed from scratch every single frame, straight off this frame's
    // own scroll-derived target values -- no direction flag, no "last known
    // live leaf", nothing carried over from the previous frame at all.
    // Being stateless means there is nothing here that can ever get left
    // behind and stuck: a leaf can't lose a status it was never granted and
    // is never taking away later, it's just re-derived fresh each frame.
    //
    // This keys off `target`, not `current`. An earlier version checked
    // `current < 0.999` instead, and that reads fine once a leaf is
    // genuinely mid-swing, but it lags right at the START of a turn:
    // `current` is the EASED value, so the instant a gentle scroll nudges a
    // settled leaf's target a hair off 1, current -- still chasing it from
    // 0.9999+ -- can sit above the 0.999 cutoff for several frames even
    // though the leaf's rotation is already visibly moving (rotation reads
    // `current` too, but even a tiny gap times PI is a visible tilt). This
    // scan wouldn't notice yet, so it kept pointing at the OLD boundary --
    // the leaf's own rank stayed frozen (still ranked as fully settled)
    // while its rotation and bend were already animating out ahead of it,
    // which is exactly what showed up as content sliding wrong on page 2
    // and a curl that looked static rather than tracking the scroll while
    // closing (the effect is most visible on a gentle scroll, since that's
    // when the gap between target and current lingers longest). `target`
    // has no such tail -- it's the raw scroll-derived value, exact and
    // immediate -- so the boundary updates the same instant the scroll
    // does, in lockstep with rotation and bend instead of a beat behind
    // them.
    var frontRight = -1;
    for(var fi = 0; fi < L; fi++){
      if(state[fi].target < 1){ frontRight = fi; break; }
    }
    var frontLeft = frontRight === -1 ? (L - 1) : (frontRight > 0 ? frontRight - 1 : -1);
    // ---- SCAN button: fade in AFTER QR leaf passes 90° (page 30 visible), vanish BEFORE next leaf hits 90° ----
    var scanOverlayEl = document.getElementById('scanOverlay');
    if(scanOverlayEl && !_scanActive){
      var t1 = Math.max(0, Math.min(1, state[QR_LEAF_INDEX].current)); // 0→1 as QR leaf flips
      var t2 = Math.max(0, Math.min(1, state[QR_LEAF_INDEX+1].current)); // 0→1 as next leaf flips
      // fadeIn  ramps 0→1 over the second half of QR leaf's flip (90°→180°, page 30 revealed)
      var fadeIn  = Math.max(0, Math.min(1, (t1 - 0.5) / 0.5));
      // fadeOut ramps 1→0 over the first half of next leaf's flip (0°→90°)
      var fadeOut = Math.max(0, Math.min(1, 1 - t2 / 0.5));
      var scanOpacity = Math.min(fadeIn, fadeOut);
      scanOverlayEl.style.opacity = scanOpacity.toFixed(3);
      scanOverlayEl.style.pointerEvents = scanOpacity > 0.15 ? 'auto' : 'none';
    }


    // RANK_BASE: rank is measured purely as DISTANCE from frontRight, one
    // step per leaf either direction, full stop -- this bounds the whole
    // book's rank spread (and so how far g.position.z ever has to travel
    // for any single leaf's own flip) to exactly one Z_GAP, independent of
    // book size or how deep a leaf sits in the stack. The earlier formula
    // blended each leaf's rank between its right-stack and left-stack
    // position (rank = (L-i)*(1-c) + (i+1)*c), which put the two endpoints
    // (L-i and i+1) as far as L-1 apart for a leaf near either end of a
    // long book -- e.g. the front cover's own single flip swung its
    // g.position.z by up to (L-1)*Z_GAP, which under this scene's
    // perspective camera reads as the page swelling larger and popping
    // toward the viewer rather than turning in place: the "detached from
    // the binding" look. Bounding every leaf's OWN swing to one Z_GAP,
    // regardless of its index, removes that popping entirely -- the page
    // stays pinned to the spine and only ever turns.
    //
    // Rank is measured as depth within a leaf's OWN stack, and the two
    // stacks share a top. That last part is the whole point. Distance from
    // the boundary (the obvious reading, and what this used to do) makes
    // the leaf on either side of it one step apart -- but those two leaves
    // are precisely the left and right pages of the spread the reader is
    // looking at, and a step of separation between them is a real depth
    // difference the perspective camera dutifully draws as a small size
    // difference, so their edges no longer meet cleanly at the binding.
    // Since the two of them lie on opposite sides of the spine and cannot
    // overlap anywhere except along the hinge line itself, there is no
    // reason for them to be separated at all: giving both stacks the same
    // top rank puts the open spread on one exact plane, and its two halves
    // line up perfectly.
    //
    // Each stack then recedes from that shared top independently, one step
    // per leaf, which is genuinely what a book does -- pages pile up away
    // from the middle on both sides.
    //
    // The live (frontRight) leaf rides from the shared top (RANK_BASE, its
    // resting height as the top of the not-yet-turned stack) up to one step
    // above it (RANK_BASE + 1) as it lands, since it comes to rest on top
    // of the already-turned stack whose own top is at RANK_BASE. Once its
    // target completes and the boundary moves on, it becomes that stack's
    // top and every leaf shifts one step in the same direction at once --
    // relative order untouched, and at this Z_GAP the absolute shift is far
    // under a pixel.
    var RANK_BASE = L;
    var bendQueue = [];
    leaves.forEach(function(g, i){
      var s = state[i];
      var c = s.current;
      var rank;
      if(frontRight === -1){
        // Every leaf turned -- one stack, most recently turned on top.
        rank = RANK_BASE - ((L - 1) - i);
      } else if(i === frontRight){
        rank = RANK_BASE + c;
      } else if(i < frontRight){
        // Already turned: the left-hand stack, topped by frontRight - 1.
        rank = RANK_BASE - ((frontRight - 1) - i);
      } else {
        // Not yet turned: the right-hand stack under the live leaf.
        rank = RANK_BASE - (i - frontRight);
      }
      setPolygonOffset(g, -rank);
      // Real depth separation, not just a GL polygon-offset hint: once two
      // leaves are both fully turned (c=1) they are LITERALLY coincident
      // geometry -- same rotation, same flat plane, zero bend. The actual
      // culprit turned out to be the covers: buildCover() gives leaf0/leaf8
      // real BoxGeometry thickness (COVER_THICKNESS = 0.015), so a cover's
      // own front/back face already sits +/-0.0075 off the group's local
      // z=0 -- more than an order of magnitude bigger than the 0.001-per-
      // rank nudge this used to apply. That nudge could never out-rank a
      // cover's own geometry, so the cover kept winning the depth test and
      // showing through over whichever inner leaf had settled beside it.
      // The gap alone used to be made bigger than COVER_THICKNESS so that
      // rank order always won over a cover's own face thickness. That works,
      // but it forces the step to be coarse, which is what put a visible
      // break at the binding (see the Z_GAP comment). Compensating for the
      // thickness directly is both exact and free:
      //
      // A cover is a box straddling its group origin, so its two printed
      // faces sit at local z = +/-COVER_THICKNESS/2. Whichever way it is
      // rotated, the face actually turned toward the reader is the one that
      // ends up at +COVER_THICKNESS/2 in world terms -- flat right, the +z
      // front face is already facing us; flat left (rotated PI), the -z back
      // face has swung around to face us, and its local -z maps to world +z.
      // So a cover's visible surface always reads half a thickness nearer
      // the camera than a paper leaf sitting at the same group z, which is
      // precisely why a cover could out-draw a page that was supposed to be
      // resting on top of it. Subtracting that half-thickness puts every
      // leaf's VISIBLE surface -- cover or paper -- on the same evenly
      // spaced ladder, so ordering stays correct no matter how fine the step
      // gets. The cover's thickness then reads purely as thickness (its edge
      // faces), which is what it is meant to be.
      g.position.z = rank * Z_GAP - (g.userData.isCover ? COVER_THICKNESS / 2 : 0);

      g.rotation.y = -Math.PI * c;
      if(!g.userData.isCover){
        bendQueue.push({ g: g, c: c, dir: s.dir, i: i });
      }
    });

    // ---- which page(s) are actually exposed to open air ----
    // Pages turn strictly in scroll order, so at any moment there are at
    // most two a real breeze could ever reach: the next one due to turn
    // (front of the untouched right-hand stack) and the one most recently
    // turned (front of the already-read left-hand stack). Everything else
    // is buried under a stack of other pages and physically can't move --
    // applying the flutter to those was the actual source of the "next
    // page's content leaking through" glitch: a buried leaf could lift
    // enough in Z to poke in front of the page actually sitting on top of
    // it. Only bending the exposed pair removes that possibility entirely.
    // (frontRight/frontLeft themselves were already computed above, before
    // the leaf loop, so the depth-ordering pass could use them too.)

    // frontLeft is always settled flat (everything before frontRight has
    // finished turning), but frontRight can be resting anywhere in [0,1] if
    // the user simply stopped scrolling mid-turn -- a page frozen half-open
    // at a steep angle to the camera. The local->world rotation mixes the
    // curl (local X) and lift (local Z) perturbations together away from
    // flat (their contribution to world Z both scale with sin/cos of the
    // same angle), so applying full-strength breeze there reads as a
    // distorted/glitchy page rather than a flutter. Only let breeze touch a
    // leaf that is genuinely resting near flat on either side.
    // Covers (index 0 / L-1) are rigid board, not paper -- bendQueue above
    // already refuses to bend their geometry for exactly that reason. The
    // breeze contact-shadow has to respect the same rule: a shadow implying
    // a fluttering edge with no actual page movement behind it (a cover
    // can't lift) is what read as a glitch on the contents spread, which
    // lives on the back face of the rigid front-cover box.
    var breezeGateR = 0, breezeGateL = 0;
    if(frontRight >= 0 && !leaves[frontRight].userData.isCover){
      var rc = state[frontRight].current;
      if(rc < 0.06 || rc > 0.94) breezeGateR = breeze.strength;
    }
    if(frontLeft >= 0 && !leaves[frontLeft].userData.isCover){
      var lc = state[frontLeft].current;
      if(lc < 0.06 || lc > 0.94) breezeGateL = breeze.strength;
    }
    // Ease toward the gate instead of snapping straight to it -- see the
    // breezeSmooth comment above the declaration for why.
    breezeSmooth.R = lerp(breezeSmooth.R, breezeGateR, 0.12);
    breezeSmooth.L = lerp(breezeSmooth.L, breezeGateL, 0.12);
    if(breezeSmooth.R < 0.0008) breezeSmooth.R = 0;
    if(breezeSmooth.L < 0.0008) breezeSmooth.L = 0;
    var breezeStrengthR = breezeSmooth.R, breezeStrengthL = breezeSmooth.L;

    bendQueue.forEach(function(item){
      var strength = item.i === frontRight ? breezeStrengthR : (item.i === frontLeft ? breezeStrengthL : 0);
      updateBend(item.g, item.c, item.dir, strength, breezeTime, item.i * 1.9 + 0.7);
    });

    var openLocal = state[0].current;
    var closeLocal = state[L-1].current;
    bookGroup.position.x = -(PAGE_W/2) * (1 - openLocal) + (PAGE_W/2) * closeLocal;
    camera.position.z = cameraDistanceFor(openLocal * (1 - closeLocal));

    // ---- ground contact shadow: reshaped every frame from the real
    // rotation of whichever cover is turning, not a linear approximation ----
    // A page hinged on a vertical spine sweeps through an arc as it turns:
    // world x of its far edge = PAGE_W * cos(angle), where angle goes from
    // 0 (flat right) to PI (flat left). For the FIRST HALF of that swing
    // (0 to PI/2, i.e. flat-right to edge-on-to-camera) the page is still
    // entirely on the right -- it hasn't reached the spine yet, let alone
    // crossed to the left, it's only getting narrower as we see it more
    // edge-on. Only in the SECOND HALF (PI/2 to PI) does it actually sweep
    // out onto the left side. A linear interpolation of openLocal/closeLocal
    // skips that: it starts sliding the shadow left from the very first
    // instant of the swing, which is not how a hinged page actually moves.
    // These two edges use the real cosine sweep instead:
    var rightEdge = PAGE_W * Math.max(0, Math.cos(Math.PI * closeLocal));
    var leftEdge = -PAGE_W * Math.max(0, -Math.cos(Math.PI * openLocal));
    var shadowWidthNow = rightEdge - leftEdge;
    var shadowCenterNow = (rightEdge + leftEdge) / 2;
    dropShadow.scale.x = shadowWidthNow / PAGE_W;
    // Fixed contact offset along the one defined light's direction (light
    // sits up-left, so its shadow falls down-right) -- sign only, magnitude
    // is the calibrated contact-shadow nudge.
    dropShadow.position.x = shadowCenterNow + (SHADOW_LIGHT_DIR.x >= 0 ? 0.035 : -0.035);

    // ---- lift shadow: follows whichever leaf is actively mid-turn ----
    // The mental model: this book lies flat on a table, shot from above,
    // one light up and to the left of frame. A page hinged at the spine
    // swings through that table's plane -- cosine of its angle gives its
    // in-plane (X) position, sine gives how far it has lifted off the
    // table toward the camera/light. Three separate things follow from
    // that lift, and all three now come from the same turnC/turnArc state
    // instead of independent tuning:
    //
    // 1) IN-PLANE POSITION: the far edge sweeps from +PAGE_W (flat right)
    //    through 0 (edge-on at the spine) to -PAGE_W (flat left) -- so the
    //    shadow sits at the right, slides to the spine, then grows back
    //    out on the left, matching the hinge itself rather than a faded
    //    image swap.
    //
    // 2) SILHOUETTE WIDTH: a page seen edge-on presents almost no width to
    //    the light, so its shadow narrows to a sliver at 90 degrees and is
    //    full width at 0/180 -- wide on the right, thin through the
    //    center, wide again on the left.
    //
    // 3) LIGHT-DIRECTION THROW: the higher a point lifts off the table,
    //    the further its shadow is thrown away from the light -- hold a
    //    card flat on a desk under a lamp and its shadow barely moves;
    //    tilt it up and the shadow stretches out away from the lamp. That
    //    lift is turnElevation = PAGE_W*sin(turnC*PI) -- the same
    //    quantity driving the page's own swing above, at its largest
    //    exactly at the edge-on midpoint. So the shadow doesn't just track
    //    the page's flat (X) position -- as it rises through the turn it
    //    also gets pulled down and to the right (this light's fixed
    //    throw direction), on BOTH the right half of the swing and the
    //    left half, peaking together with the silhouette going thinnest.
    var turnFarX = PAGE_W * Math.cos(Math.PI * turnC);
    var turnWidthFrac = Math.abs(Math.cos(Math.PI * turnC));
    var turnElevation = PAGE_W * Math.sin(Math.PI * turnC);
    var LIFT_THROW = 0.17;
    liftShadow.position.x = turnFarX * 0.5 + SHADOW_LIGHT_DIR.x * turnElevation * LIFT_THROW;
    liftShadow.position.y = SHADOW_LIGHT_DIR.y * turnElevation * LIFT_THROW;
    liftShadow.scale.set(Math.max(0.02, turnWidthFrac), 1, 1);
    liftShadowMat.opacity = 0.5 * Math.min(1, turnArc * 6);

    updateBreezeShadow(breezeShadowR, breezeShadowMatR, frontRight, frontRight >= 0 ? leaves[frontRight].position.z : 0, breezeTime, breezeStrengthR);
    updateBreezeShadow(breezeShadowL, breezeShadowMatL, frontLeft, frontLeft >= 0 ? leaves[frontLeft].position.z : 0, breezeTime, breezeStrengthL);

    renderer.render(scene, camera);
    requestAnimationFrame(render);
  }

  function start(){
    onResize();
    loadingEl.style.opacity = '0';
    setTimeout(function(){ loadingEl.style.display = 'none'; }, 500);
    requestAnimationFrame(render);
    loadAllPageImages();
    initChapterTabs();
    initAnt();
  }

  // ---------- occasional ant ----------
  // A tiny creative easter egg: a small ink-toned ant occasionally strolls
  // across the paper margin around the book -- never over the book itself.
  // Pure 2D canvas overlay, fully independent of the WebGL scene/render
  // loop, so it never interferes with the flip animation or its own RAF
  // budget. Appears at random intervals (roughly every 10-30s), walks a
  // short, gently wandering path along whichever screen edge it picked,
  // then leaves off-screen and goes quiet again. Respects
  // prefers-reduced-motion (skipped entirely, matching the rest of the site).
  function initAnt(){
    if(reduceMotion) return;
    var canvas = document.getElementById('antLayer');
    if(!canvas) return;
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resizeAntCanvas(){
      canvas.width = Math.round(window.innerWidth * dpr);
      canvas.height = Math.round(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeAntCanvas();
    window.addEventListener('resize', resizeAntCanvas);

    var INK = '#241F1A';
    // Overall size multiplier for the whole drawing. The first version drew
    // at ~1 local unit = 1px, which put the entire ant under ~10px long --
    // at that size the legs are sub-pixel hairlines that dissolve into a
    // faint smudge instead of reading as an insect. Everything below is
    // still authored in the same small local coordinate space; this just
    // blows the final drawing up to a size where the silhouette (and in
    // particular the pinched thorax/abdomen waist that's the single most
    // recognizable "this is an ant" cue) is actually legible.
    var ANT_SCALE = 1.37; // 20% smaller than before
    var ant = null; // active walk state, or null while idle
    var idleUntil = performance.now() + (8000 + Math.random() * 14000);

    // ---------- housefly: lands somewhere on the book during inactivity,
    // bolts the instant real activity resumes ----------
    // Reuses the exact same idle clock the wind breeze runs on
    // (lastActivityTime, reset by the same mousemove/scroll/key listeners
    // set up alongside it) -- "inactivity" should mean one consistent thing
    // across every ambient effect on the page, not a separate timer per
    // creature that could disagree with the others.
    var FLY_SCALE = 2;
    var FLY_INK = '#1c1a17';
    var FLY_EYE = '#7a2320';
    var FLY_IDLE_SECONDS = 9; // a little slower to arrive than the breeze
    var fly = null; // { state:'entering'|'sitting'|'leaving', ... } or null while hidden
    var flyCooldownUntil = performance.now() + 4000 + Math.random() * 6000;

    function pickFlyLanding(){
      var w = window.innerWidth, h = window.innerHeight;
      // A generous central zone stands in for "somewhere on the book"
      // without needing to project the book's exact 3D page geometry into
      // screen space for what's ultimately a small ambient detail --
      // cameraDistanceFor's own framing margin keeps the book roughly in
      // this region on any screen size.
      var tx = w * (0.3 + Math.random() * 0.4);
      var ty = h * (0.22 + Math.random() * 0.5);
      // Enters from whichever side is closer, so the approach is a short
      // hop in from just off-frame rather than a trip across the screen.
      var fromLeft = tx < w / 2;
      var startX = fromLeft ? -30 : w + 30;
      var startY = ty + (Math.random() * 160 - 80);
      return { x: startX, y: startY, tx: tx, ty: ty };
    }

    function drawFly(x, y, angle, wingPhase, wingsOut){
      // Same fixed-light contact shadow convention as the ant/book.
      var dropPx = 1.6 * FLY_SCALE;
      var sx = x + SHADOW_LIGHT_DIR.x * dropPx;
      var sy = y - SHADOW_LIGHT_DIR.y * dropPx;
      ctx.save();
      ctx.filter = 'blur(1.1px)';
      ctx.fillStyle = 'rgba(20,17,13,0.26)';
      ctx.beginPath();
      ctx.ellipse(sx, sy, 2.6 * FLY_SCALE, 1.5 * FLY_SCALE, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(FLY_SCALE, FLY_SCALE);

      // Wings: spread and flickering fast while airborne (or mid-flick at
      // rest), folded flat along the body when calmly sitting.
      if(wingsOut){
        var flap = Math.sin(wingPhase) * 0.5 + 0.5;
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#e9edf2';
        ctx.strokeStyle = 'rgba(60,60,60,0.4)';
        ctx.lineWidth = 0.12;
        [1, -1].forEach(function(side){
          ctx.save();
          ctx.translate(0.3, side * 0.6);
          ctx.rotate(side * (0.35 + flap * 0.25));
          ctx.beginPath();
          ctx.ellipse(1.4, 0, 2.2, 0.95, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        });
        ctx.restore();
      } else {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = 'rgba(40,38,34,0.5)';
        [1, -1].forEach(function(side){
          ctx.beginPath();
          ctx.ellipse(-0.2, side * 0.5, 1.8, 0.35, side * 0.15, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }

      // Minimal legs -- just enough to read as standing rather than floating.
      ctx.strokeStyle = FLY_INK;
      ctx.lineWidth = 0.28;
      ctx.lineCap = 'round';
      [-0.9, 0.1, 1.0].forEach(function(ox){
        [1, -1].forEach(function(side){
          ctx.beginPath();
          ctx.moveTo(ox, side * 0.9);
          ctx.lineTo(ox + side * 0.15, side * 1.9);
          ctx.stroke();
        });
      });

      // Body: abdomen, thorax, head.
      ctx.fillStyle = FLY_INK;
      ctx.beginPath(); ctx.ellipse(-1.1, 0, 1.5,  1.15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( 0.5, 0, 1.05, 0.95, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse( 1.7, 0, 0.75, 0.7,  0, 0, Math.PI * 2); ctx.fill();

      // Large red compound eyes -- the single most recognizable "this is a
      // housefly, not just a dark speck" cue.
      ctx.fillStyle = FLY_EYE;
      ctx.beginPath(); ctx.ellipse(1.9, -0.42, 0.42, 0.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(1.9,  0.42, 0.42, 0.5, 0, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }

    // The book is always camera-framed with margin around it (see
    // cameraDistanceFor/SIZE_MARGIN above), so a band right at the physical
    // edge of the viewport is reliably clear of the book on any screen
    // size -- that's the strip the ant is allowed to wander within.
    var EDGE_START = 12, EDGE_MARGIN = 46;

    function pickWalk(){
      var w = window.innerWidth, h = window.innerHeight;
      var edge = Math.floor(Math.random() * 4); // 0 top, 1 bottom, 2 left, 3 right
      var horizontal = (edge === 0 || edge === 1);
      var fromStart = Math.random() < 0.5; // which direction it travels along the edge
      var cMin, cMax; // the band, in the axis perpendicular to travel, it's allowed to wander within
      if(edge === 0){ cMin = EDGE_START; cMax = EDGE_START + EDGE_MARGIN; }
      else if(edge === 1){ cMax = h - EDGE_START; cMin = cMax - EDGE_MARGIN; }
      else if(edge === 2){ cMin = EDGE_START; cMax = EDGE_START + EDGE_MARGIN; }
      else { cMax = w - EDGE_START; cMin = cMax - EDGE_MARGIN; }

      var perp = cMin + Math.random() * (cMax - cMin);
      var dir = fromStart ? 1 : -1;
      var x, y;
      if(horizontal){ x = fromStart ? -34 : w + 34; y = perp; }
      else { y = fromStart ? -34 : h + 34; x = perp; }

      var baseHeading = horizontal ? (dir > 0 ? 0 : Math.PI) : (dir > 0 ? Math.PI/2 : -Math.PI/2);

      // Sometimes it's a single ant, sometimes a short line of them --
      // real ant trails are almost never exactly one ant, and rarely more
      // than a handful, so this is weighted toward solo/pairs with
      // occasional longer lines rather than a flat 1-4 pick.
      var countRoll = Math.random();
      var antCount = countRoll < 0.42 ? 1 : countRoll < 0.70 ? 2 : countRoll < 0.88 ? 3 : 4;
      var speed = 58 + Math.random() * 34; // faster, brisker walking pace
      var followers = [];
      var cumDelay = 0;
      for(var fi = 1; fi < antCount; fi++){
        // Space by a target pixel gap (~1.3-2.2x an ant's own body length)
        // rather than a fixed time, converted through this walk's own
        // speed -- a raw time delay reads as nose-to-tail crowding at slow
        // speeds and as an oddly spread-out line at fast ones.
        cumDelay += (26 + Math.random() * 22) / speed;
        followers.push({ delay: cumDelay });
      }

      return {
        x:x, y:y, horizontal:horizontal, dir:dir, cMin:cMin, cMax:cMax,
        speed: speed,
        heading: baseHeading, headingOffset: 0,
        // Two slow sine components (different, non-matching periods) sum
        // into one organic, never-repeating meander -- this is what bends
        // the path into the same kind of easy S-curve winding as a real
        // ant trail, entirely through smooth, continuous curvature. There
        // is no timer, no discrete "decide to turn now" event anywhere in
        // this walk -- direction is always changing gradually, never
        // snapping, so there's nothing that can read as a skid or a stop.
        wF1: 0.28 + Math.random() * 0.22, wP1: Math.random() * Math.PI * 2,
        wF2: 0.7 + Math.random() * 0.5,   wP2: Math.random() * Math.PI * 2,
        // Followers don't run their own independent simulation -- they
        // replay the leader's own recorded (x,y,heading,legPhase) history
        // at a fixed delay, so the whole line traces exactly the same
        // curve the leader drew, just staggered in time. That's what
        // makes it read as one flowing trail rather than several ants
        // each independently wandering near each other.
        followers: followers, history: [],
        legPhase: 0, t: 0
      };
    }

    function drawAnt(x, y, angle, legPhase){
      // Contact shadow, drawn first and in plain screen space -- not
      // inside the rotate/scale block the body uses below -- so it stays
      // pinned to the site's one fixed light direction (SHADOW_LIGHT_DIR,
      // the same upper-left key light the book's own shadows are built
      // from) regardless of which way the ant is currently facing. A
      // small soft blob offset toward the shadow side reads as "this is a
      // tiny thing sitting on the paper" rather than a flat decal glued
      // to the screen -- the same reasoning as the book's dropShadow/
      // liftShadow, just far smaller since the ant itself is far smaller.
      var dropPx = 2.0 * ANT_SCALE;
      var sx = x + SHADOW_LIGHT_DIR.x * dropPx;
      var sy = y - SHADOW_LIGHT_DIR.y * dropPx; // world +y is up, canvas +y is down
      ctx.save();
      ctx.filter = 'blur(1.4px)';
      ctx.fillStyle = 'rgba(20,17,13,0.30)';
      ctx.beginPath();
      ctx.ellipse(sx, sy, 4.3 * ANT_SCALE, 2.0 * ANT_SCALE, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(ANT_SCALE, ANT_SCALE);
      ctx.strokeStyle = INK;
      ctx.fillStyle = INK;
      ctx.lineCap = 'round';

      // Local +x is the direction of travel (the angle passed in already
      // points that way), so the head sits at positive x and the abdomen
      // trails behind at negative x -- the earlier version had these
      // reversed, which made the ant travel abdomen-first. That reads as
      // subtly "wrong" even when you can't immediately say why, which was
      // very likely a big part of what didn't feel like a real ant.
      //
      // 6 legs, tripod gait: front-left+mid-right+back-left swing together,
      // opposite to mid-left+front-right+back-right -- the alternating
      // triad pattern real ants (and most hexapods) actually walk with.
      // Drawn as a single curve through a knee point rather than two
      // straight segments, so each leg reads as an organic limb instead of
      // a schematic tick mark.
      ctx.lineWidth = 0.62;
      var legDefs = [
        { ox: 2.0, side: 1, tripod:0 },
        { ox: 0.2, side: 1, tripod:1 },
        { ox:-1.6, side: 1, tripod:0 },
        { ox: 2.0, side:-1, tripod:1 },
        { ox: 0.2, side:-1, tripod:0 },
        { ox:-1.6, side:-1, tripod:1 }
      ];
      legDefs.forEach(function(leg){
        var phase = legPhase + (leg.tripod ? Math.PI : 0);
        var swing = Math.sin(phase) * 2.1;
        var lift = Math.max(0, Math.cos(phase)) * 0.5;
        var kx = leg.ox + swing * 0.45;
        var ky = leg.side * (2.7 + lift * 0.4);
        var fx = leg.ox + swing * 1.15;
        var fy = leg.side * 5.3;
        ctx.beginPath();
        ctx.moveTo(leg.ox, leg.side * 1.05);
        ctx.quadraticCurveTo(kx, ky, fx, fy);
        ctx.stroke();
      });

      // antennae, forward of the head, swaying independent of the gait
      ctx.lineWidth = 0.45;
      var wiggle = Math.sin(legPhase * 0.45) * 0.35;
      ctx.beginPath();
      ctx.moveTo(3.7, -0.55); ctx.quadraticCurveTo(4.6, -1.3, 5.6, -1.9 + wiggle);
      ctx.moveTo(3.7,  0.55); ctx.quadraticCurveTo(4.6,  1.3, 5.6,  1.9 - wiggle);
      ctx.stroke();

      // body: head, thorax, a narrow petiole "waist", then abdomen -- that
      // pinch between thorax and abdomen is the single detail that makes a
      // small dark blob read as an ant rather than a generic bug or a
      // smudge, so it's worth its own segment rather than folding into a
      // continuous taper.
      ctx.beginPath(); ctx.ellipse( 4.0,  0, 1.15, 1.05, 0, 0, Math.PI*2); ctx.fill(); // head
      ctx.beginPath(); ctx.ellipse( 1.5,  0, 1.55, 1.25, 0, 0, Math.PI*2); ctx.fill(); // thorax
      ctx.beginPath(); ctx.ellipse(-0.65, 0, 0.55, 0.5,  0, 0, Math.PI*2); ctx.fill(); // petiole/waist
      ctx.beginPath(); ctx.ellipse(-3.3,  0, 2.9,  1.95, 0, 0, Math.PI*2); ctx.fill(); // abdomen

      ctx.restore();
    }

    function isExited(px, py, horizontal, dir, w, h){
      return horizontal
        ? (dir > 0 ? px > w + 34 : px < -34)
        : (dir > 0 ? py > h + 34 : py < -34);
    }

    function angleLerp(a, b, t){
      var d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
      if(d < -Math.PI) d += Math.PI * 2;
      return a + d * t;
    }

    // Linear-interpolates the leader's recorded path to whatever exact
    // instant a follower needs -- history is sampled once per animation
    // frame, so a follower's delay almost never lands exactly on a
    // recorded timestamp.
    function sampleHistory(history, targetT){
      if(history.length === 0) return null;
      if(targetT <= history[0].t) return history[0];
      var last = history[history.length - 1];
      if(targetT >= last.t) return last;
      for(var i = 1; i < history.length; i++){
        if(history[i].t >= targetT){
          var a = history[i - 1], b = history[i];
          var span = b.t - a.t;
          var frac = span > 0 ? (targetT - a.t) / span : 0;
          return {
            x: a.x + (b.x - a.x) * frac,
            y: a.y + (b.y - a.y) * frac,
            heading: angleLerp(a.heading, b.heading, frac),
            legPhase: a.legPhase + (b.legPhase - a.legPhase) * frac
          };
        }
      }
      return last;
    }

    var lastTime = performance.now();
    function tick(now){
      var dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      if(!ant){
        if(now >= idleUntil) ant = pickWalk();
      } else {
        ant.t += dt;
        var w = window.innerWidth, h = window.innerHeight;
        var baseFwd = ant.horizontal
          ? (ant.dir > 0 ? 0 : Math.PI)
          : (ant.dir > 0 ? Math.PI/2 : -Math.PI/2);

        // The path is one continuous curve, never a straight line and
        // never a stop-turn-go sequence either -- ant.headingOffset (the
        // live deviation from dead-ahead) is eased every frame toward a
        // "desired" offset that blends two things:
        //
        // 1) an organic meander -- the sum of two slow sine waves defined
        //    in pickWalk(), which winds the path into the same kind of
        //    easy S-curve as a real ant trail purely through gradual
        //    curvature, with nothing that could read as a discrete event.
        //
        // 2) a gentle pull back toward the center of the wander band the
        //    closer the ant gets to its edge, so it stays clear of the
        //    book without ever needing a hard clamp or a snap.
        //
        // Because this is a single continuous first-order lag (not a mode
        // switch, not a pause), the heading -- and so the body's own
        // rotation -- glides through every degree in between. There is no
        // instant the facing direction jumps, which is what the earlier
        // stop-and-reorient version was doing and what read as skidding.
        var perpNow = ant.horizontal ? ant.y : ant.x;
        var mid = (ant.cMin + ant.cMax) / 2;
        var half = (ant.cMax - ant.cMin) / 2;
        var normPerp = half > 0 ? (perpNow - mid) / half : 0; // -1..1
        var k = ant.horizontal ? 1 : -1;
        var boundaryOffset = -normPerp * k * ant.dir * 0.9;

        var meander = 0.5 * Math.sin(ant.t * ant.wF1 + ant.wP1)
                    + 0.32 * Math.sin(ant.t * ant.wF2 + ant.wP2);

        var desiredOffset = Math.max(-1.2, Math.min(1.2, boundaryOffset + meander));
        ant.headingOffset += (desiredOffset - ant.headingOffset) * Math.min(1, dt * 1.6);
        ant.heading = baseFwd + ant.headingOffset;

        // cos(headingOffset) stays positive for the whole clamped range
        // above, so forward (exit-ward) progress never stalls or reverses
        // -- the curve always advances, it just advances along a bend.
        ant.x += Math.cos(ant.heading) * ant.speed * dt;
        ant.y += Math.sin(ant.heading) * ant.speed * dt;

        ant.legPhase += dt * (8 + ant.speed * 0.35);

        // Record this frame's state so any followers can replay it later
        // at their own delay -- see the note on `followers` in pickWalk().
        ant.history.push({ t: ant.t, x: ant.x, y: ant.y, heading: ant.heading, legPhase: ant.legPhase });
        var maxDelay = ant.followers.length ? ant.followers[ant.followers.length - 1].delay : 0;
        while(ant.history.length > 2 && ant.history[1].t < ant.t - maxDelay - 0.5) ant.history.shift();

        var leaderExited = isExited(ant.x, ant.y, ant.horizontal, ant.dir, w, h);
        if(!leaderExited) drawAnt(ant.x, ant.y, ant.heading, ant.legPhase);

        // Each follower is just a delayed read of the leader's own path --
        // it only starts existing once enough time has passed for its
        // delay to "arrive" at the leader's start point, which is what
        // makes the line fill in one at a time rather than all popping in
        // together.
        ant.followers.forEach(function(f){
          var sampleT = ant.t - f.delay;
          if(sampleT < 0) return;
          var s = sampleHistory(ant.history, sampleT);
          if(!s || isExited(s.x, s.y, ant.horizontal, ant.dir, w, h)) return;
          drawAnt(s.x, s.y, s.heading, s.legPhase);
        });

        // The line as a whole is only done once its trailing-most member
        // (whichever one is furthest behind -- the leader itself if
        // walking solo) has exited, not the instant the leader does --
        // otherwise followers still mid-screen would just vanish.
        var trailSampleT = ant.t - maxDelay;
        var trailExited = false;
        if(maxDelay === 0){
          trailExited = leaderExited;
        } else if(trailSampleT >= 0){
          var trailSample = sampleHistory(ant.history, trailSampleT);
          trailExited = !!trailSample && isExited(trailSample.x, trailSample.y, ant.horizontal, ant.dir, w, h);
        }

        if((trailSampleT >= 0 && trailExited) || ant.t > 60 + maxDelay){
          ant = null;
          idleUntil = now + (10000 + Math.random() * 18000);
        }
      }

      // ---- housefly ----
      var flyIdleSeconds = (now - lastActivityTime) / 1000;
      if(!fly){
        if(now >= flyCooldownUntil && flyIdleSeconds > FLY_IDLE_SECONDS){
          var spot = pickFlyLanding();
          var flyDx = spot.tx - spot.x, flyDy = spot.ty - spot.y;
          var entryHeading = Math.atan2(flyDy, flyDx);
          var entryDist = Math.max(1, Math.hypot(flyDx, flyDy));
          // Bow the approach sideways into a real arc (a fraction of the
          // travel distance, either side at random) instead of a straight
          // slide -- a quadratic-bezier control point off the midpoint.
          var curveMag = Math.min(150, Math.max(35, entryDist * (0.15 + Math.random() * 0.15))) * (Math.random() < 0.5 ? -1 : 1);
          var midX = (spot.x + spot.tx) / 2, midY = (spot.y + spot.ty) / 2;
          var perpX = -Math.sin(entryHeading), perpY = Math.cos(entryHeading);
          fly = {
            state: 'entering',
            x: spot.x, y: spot.y, tx: spot.tx, ty: spot.ty,
            startX: spot.x, startY: spot.y,
            ctrlX: midX + perpX * curveMag, ctrlY: midY + perpY * curveMag - 16,
            entryHeading: entryHeading,
            heading: entryHeading,
            wingPhase: 0, t: 0,
            // Unhurried arrival speed -- noticeably slower than the
            // startled dart it leaves with below.
            enterDur: Math.max(0.9, entryDist / (380 + Math.random() * 70)),
            flicking: 0, nextFlick: 1.5 + Math.random() * 3
          };
        }
      } else {
        fly.t += dt;
        fly.wingPhase += dt * 60;

        if(fly.state === 'entering'){
          // A slow, curved arc in from off-frame -- a quadratic bezier
          // through the sideways-bowed control point above -- reading as
          // a real, unhurried flight rather than a sprite sliding into
          // place along a straight line.
          var edur = fly.enterDur;
          var ep = Math.min(1, fly.t / edur);
          var s = ep * ep * (3 - 2 * ep); // smootherstep ease-in-out
          var omt = 1 - s;
          fly.x = omt * omt * fly.startX + 2 * omt * s * fly.ctrlX + s * s * fly.tx;
          fly.y = omt * omt * fly.startY + 2 * omt * s * fly.ctrlY + s * s * fly.ty;
          var tanX = 2 * omt * (fly.ctrlX - fly.startX) + 2 * s * (fly.tx - fly.ctrlX);
          var tanY = 2 * omt * (fly.ctrlY - fly.startY) + 2 * s * (fly.ty - fly.ctrlY);
          if(tanX !== 0 || tanY !== 0) fly.heading = Math.atan2(tanY, tanX);
          drawFly(fly.x, fly.y, fly.heading, fly.wingPhase, true);
          if(ep >= 1){
            fly.state = 'sitting';
            fly.t = 0;
            fly.x = fly.tx;
            fly.y = fly.ty;
          }
        } else if(fly.state === 'sitting'){
          // Bolts the instant real activity resumes -- flyIdleSeconds is
          // already back near 0 the moment the very listener that feeds it
          // fires, same mechanism the wind breeze interrupts on.
          if(flyIdleSeconds < 0.15){
            fly.state = 'leaving';
            fly.t = 0;
            // A startled fly bolts in a fresh direction -- kept well away
            // from the reverse of how it flew in, so it never reads as
            // retracing its own path back out -- and banks into a curve
            // via a steady turn rate rather than flying a straight line.
            var avoidHeading = fly.entryHeading + Math.PI;
            var minGap = 75 * Math.PI / 180;
            fly.leaveHeading = avoidHeading + minGap + Math.random() * (Math.PI * 2 - 2 * minGap);
            fly.leaveTurnRate = (Math.random() < 0.5 ? -1 : 1) * (1.0 + Math.random() * 1.8);
            drawFly(fly.x, fly.y, fly.leaveHeading, fly.wingPhase, true);
          } else {
            fly.nextFlick -= dt;
            if(fly.nextFlick <= 0){
              fly.flicking = 0.25;
              fly.nextFlick = 2 + Math.random() * 4;
            }
            if(fly.flicking > 0) fly.flicking -= dt;
            drawFly(fly.x, fly.y, fly.heading, fly.wingPhase, fly.flicking > 0);
          }
        } else if(fly.state === 'leaving'){
          // A sudden, much faster dart than the arrival -- our presence
          // startled it -- curving away on a steady bank instead of a
          // straight line.
          var lspeed = 900;
          fly.leaveHeading += fly.leaveTurnRate * dt;
          fly.x += Math.cos(fly.leaveHeading) * lspeed * dt;
          fly.y += Math.sin(fly.leaveHeading) * lspeed * dt - 55 * dt; // climbs as it curves away
          fly.heading = fly.leaveHeading;
          drawFly(fly.x, fly.y, fly.heading, fly.wingPhase, true);
          if(fly.x < -40 || fly.x > window.innerWidth + 40 || fly.y < -40 || fly.y > window.innerHeight + 40 || fly.t > 1.1){
            fly = null;
            flyCooldownUntil = now + 6000 + Math.random() * 14000;
          }
        }
      }

      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function scrollYForScaled(scaled){
    var vh = window.innerHeight;
    var maxScroll = spacerHeight - vh;
    var progress = scaled / TOTAL_UNITS;
    return progress * maxScroll;
  }

  var scrollAnimFrame = null;

  function animateScrollTo(targetY,fromScaled,toScaled){
    if(scrollAnimFrame){cancelAnimationFrame(scrollAnimFrame);scrollAnimFrame=null;}
    _vTgt=vc(targetY);
  }

  function currentScaled(){
    var vh = window.innerHeight;
    var maxScroll = spacerHeight - vh;
    var progress = maxScroll > 0 ? Math.min(Math.max(window.scrollY / maxScroll, 0), 1) : 0;
    return progress * TOTAL_UNITS;
  }

  var chapterTabEls = [];
  var activeTabIdx = -1;

  function updateActiveTab(){
    var cs = currentScaled();
    var closestIdx = 0, closestDist = Infinity;
    NAV_POINTS.forEach(function(p, idx){
      var d = Math.abs(p.scaled - cs);
      if(d < closestDist){ closestDist = d; closestIdx = idx; }
    });
    if(closestIdx === activeTabIdx) return;
    activeTabIdx = closestIdx;
    chapterTabEls.forEach(function(tab, idx){
      tab.classList.toggle('active', idx === closestIdx);
    });
  }

  // Native 'scroll' events can fire far more often than the display can
  // paint (especially with trackpad momentum), and each handler call was
  // re-querying the DOM -- that extra work competing with the WebGL render
  // loop on the main thread is a common cause of stutter while scrolling.
  // Coalesce it to once per animation frame instead.
  var activeTabQueued = false;
  function queueActiveTabUpdate(){
    if(activeTabQueued) return;
    activeTabQueued = true;
    requestAnimationFrame(function(){
      activeTabQueued = false;
      updateActiveTab();
    });
  }

  function initChapterTabs(){
    var rail = document.getElementById('chapterTabs');
    NAV_POINTS.forEach(function(p){
      var btn = document.createElement('button');
      btn.className = 'chapter-tab';
      btn.textContent = p.label;
      btn.addEventListener('click', function(){
        var from = currentScaled();
        animateScrollTo(scrollYForScaled(p.scaled), from, p.scaled);
      });
      rail.appendChild(btn);
      chapterTabEls.push(btn);
    });
    window.addEventListener('scroll', queueActiveTabUpdate, { passive:true });
    updateActiveTab();
  }


  function drawImageCover(ctx, img, w, h){
    var ir = img.width / img.height, tr = w / h;
    var sx, sy, sw, sh;
    if(ir > tr){
      sh = img.height; sw = sh * tr; sx = (img.width - sw) / 2; sy = 0;
    } else {
      sw = img.width; sh = sw / tr; sx = 0; sy = (img.height - sh) / 2;
    }
    // Source photos land here at up to 13500x18000 and get squeezed into a
    // texture canvas a fraction of that size -- the browser's default
    // downscale filter (imageSmoothingQuality defaults to a cheaper setting
    // than 'high' in most engines) visibly softened fine linework and text
    // at that ratio. Forcing 'high' uses a proper multi-step/area filter
    // instead, which is what was actually missing, not just resolution.
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
  }

  function textureFromImage(img, side){
    var w = 2048, h = Math.round(2048 * (PAGE_H / PAGE_W));
    var canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    drawImageCover(ctx, img, w, h);
    paintPageVignette(ctx, w, h, side === 'front' ? 'left' : 'right');
    drawGutterShadow(ctx, w, h, side === 'front' ? 'left' : 'right');
    var tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy()
    return tex;
  }

  function applyTextureToFace(leafIndex, side, tex){
    var g = leaves[leafIndex];
    var isCover = g.userData.isCover;

    // Only plane-based paper leaves need the UV flip on their back face —
    // the shared geometry there has one UV set, so the back (viewed from
    // behind) needs correcting. BoxGeometry covers already have independent,
    // correctly-oriented UVs per face and must NOT be flipped again.
    if(!isCover && side === 'back'){
      // See the matching flip in buildLeaf -- ClampToEdgeWrapping avoids the
      // opposite-edge bleed that RepeatWrapping caused at the u=0/u=1 seam.
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.repeat.x = -1;
      tex.offset.x = 1;
    }

    if(isCover){
      var mats = g.children[0].material;
      var idx = side === 'front' ? 4 : 5;
      if(mats[idx].map) mats[idx].map.dispose();
      mats[idx].map = tex;
      mats[idx].needsUpdate = true;
    } else {
      g.children.forEach(function(mesh){
        var isFront = mesh.material.side === THREE.FrontSide;
        if((side === 'front') === isFront){
          if(mesh.material.map) mesh.material.map.dispose();
          mesh.material.map = tex;
          mesh.material.needsUpdate = true;
        }
      });
    }
  }
