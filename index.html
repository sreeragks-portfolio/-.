  // ---- SCAN interaction ----
  var _scanActive = false;
  var _scanTimer  = null;

  window.triggerScan = function(){
    if(_scanActive) return;
    _scanActive = true;

    var scanBtn = document.getElementById('scanBtn');
    if(scanBtn) scanBtn.textContent = 'OPENING…';
    // Hide the overlay div itself while scan is active (RAF loop skips it via _scanActive)
    var scanOvEl = document.getElementById('scanOverlay');
    if(scanOvEl){ scanOvEl.style.opacity = '0'; scanOvEl.style.pointerEvents = 'none'; }

    // ── Step 1: Scroll book to perfectly flat open position ──────────────
    // For leaf 2 to be front-right and fully flat:
    //   state[2].target = clamp(scaled - (PAUSE+2), 0,1) = 0
    //   → scaled = PAUSE + 2 = 2.6
    //   → progress = scaled / TOTAL_UNITS = 2.6 / 5.2 = 0.5
    //   → scrollY = 0.5 * maxScroll
    var targetScroll = (PAUSE + QR_LEAF_INDEX + 1) / TOTAL_UNITS * (spacerHeight - window.innerHeight);
    // Guard: spacerHeight might be 0 on first load — recompute if needed
    if(spacerHeight <= 0) layoutSpacer();
    if(targetScroll < 0 || !isFinite(targetScroll)) targetScroll = 0;
    window.scrollTo({ top: targetScroll, behavior: 'smooth' });

    // ── Step 2: After scroll + easing settle, show hand ──────────────────
    setTimeout(function(){
      if(!_scanActive) return;

      if(scanBtn) scanBtn.textContent = 'SCANNING…';

      var hand    = document.getElementById('handContainer');
      var dismiss = document.getElementById('handDismiss');

      // Position hand so phone screen centre lands on page centre
      if(hand && camera){
        var qrWorld = new THREE.Vector3(-PAGE_W * 0.5, 0, 0.02);
        var ndc     = qrWorld.clone().project(camera);
        var sx = ( ndc.x + 1) * 0.5 * window.innerWidth;
        var sy = (-ndc.y + 1) * 0.5 * window.innerHeight;

        var cw = Math.min(window.innerWidth * 0.70, 720);
        var ch = cw * (13909 / 9913);
        var offsetX = cw * 0.510;
        var offsetY = ch * 0.405;

        hand.style.left   = (sx - offsetX) + 'px';
        hand.style.top    = (sy - offsetY) + 'px';
        hand.style.width  = cw + 'px';
        hand.style.height = ch + 'px';
      }

      // Animate hand in
      if(hand){
        hand.classList.remove('departing');
        void hand.offsetWidth;
        hand.classList.add('scanning');
      }
      if(dismiss) dismiss.classList.add('active');

      // ── Step 3: After 2.4s — flash, audio, music player ──────────────
      _scanTimer = setTimeout(function(){
        var flash = document.getElementById('scanFlash');
        if(flash){
          flash.classList.add('on');
          setTimeout(function(){ flash.classList.remove('on'); }, 350);
        }

        var audio = document.getElementById('bookAudio');
        if(audio && audio.src && audio.src !== window.location.href && audio.src !== ''){
          audio.play().catch(function(){});
          var pill = document.getElementById('nowPlaying');
          if(pill){ pill.classList.add('show'); }
        }

        if(scanBtn) scanBtn.textContent = '▶  SCAN';

        // Show music player, hide scanner UI
        var mpEl   = document.getElementById('musicPlayer');
        var scanUI = document.getElementById('scanUI');
        if(scanUI) scanUI.style.display = 'none';
        if(mpEl){
          mpEl.classList.add('active');
          var hd = document.getElementById('handDismiss');
          if(hd) hd.style.pointerEvents = 'none';
          if(audio){
            var pi = document.getElementById('mp-play-icon');
            var pa = document.getElementById('mp-pause-icon');
            if(pi) pi.style.display = 'none';
            if(pa) pa.style.display = '';
            mpEl.classList.add('playing');
            mpStartProgress(audio);
            mpUpdateUI(audio);
          }
        }
      }, 2400);

    }, 900); // wait for smooth scroll + Three.js easing to settle
  };

  window.closeHandOverlay = function(){
    _scanActive = false;
    if(_scanTimer){ clearTimeout(_scanTimer); _scanTimer = null; }

    var hand    = document.getElementById('handContainer');
    var dismiss = document.getElementById('handDismiss');
    var pill    = document.getElementById('nowPlaying');
    var scanBtn = document.getElementById('scanBtn');

    if(hand){
      hand.classList.remove('scanning');
      void hand.offsetWidth;
      hand.classList.add('departing');
    }
    if(dismiss) dismiss.classList.remove('active');
    if(pill) pill.classList.remove('show');
    if(scanBtn) scanBtn.textContent = '▶  SCAN';

    // stop audio
    var audio = document.getElementById('bookAudio');
    if(audio){ audio.pause(); audio.currentTime = 0; }
    // Reset music player
    var mpEl   = document.getElementById('musicPlayer');
    var scanUI = document.getElementById('scanUI');
    var hd2    = document.getElementById('handDismiss');
    if(hd2) hd2.style.pointerEvents = '';
    if(mpEl){ mpEl.classList.remove('active','playing'); }
    if(scanUI) scanUI.style.display = '';
    if(_mpProgressTimer){ clearInterval(_mpProgressTimer); _mpProgressTimer = null; }
    var pi = document.getElementById('mp-play-icon');
    var pa = document.getElementById('mp-pause-icon');
    if(pi) pi.style.display = '';
    if(pa) pa.style.display = 'none';
    var fill = document.getElementById('mp-progress-fill');
    var dot  = document.getElementById('mp-progress-dot');
    if(fill) fill.style.width = '0%';
    if(dot)  dot.style.left   = '0%';

    // clean up departing class after animation
    setTimeout(function(){
      var h = document.getElementById('handContainer');
      if(h) h.classList.remove('departing');
    }, 550);
  };

  // Escape key dismisses
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') window.closeHandOverlay();
  });
  // Clicking outside the page-spread also dismisses
  document.getElementById('handDismiss') && document.getElementById('handDismiss').addEventListener('click', window.closeHandOverlay);

})();
</script>
<script>
  var _mpProgressTimer = null;

  function mpFmtTime(s){
    if(isNaN(s)||!isFinite(s)||s<0) return '0:00';
    var m = Math.floor(s/60), sec = Math.floor(s%60);
    return m + ':' + (sec<10?'0':'') + sec;
  }

  function mpUpdateUI(audio){
    if(!audio) return;
    var pct  = audio.duration ? (audio.currentTime / audio.duration * 100) : 0;
    var fill = document.getElementById('mp-progress-fill');
    var dot  = document.getElementById('mp-progress-dot');
    var cur  = document.getElementById('mp-cur');
    var dur  = document.getElementById('mp-dur');
    if(fill) fill.style.width = pct + '%';
    if(dot)  dot.style.left   = pct + '%';
    if(cur)  cur.textContent  = mpFmtTime(audio.currentTime);
    if(dur)  dur.textContent  = mpFmtTime(audio.duration);
  }

  function mpStartProgress(audio){
    if(!audio) audio = document.getElementById('bookAudio');
    if(_mpProgressTimer) clearInterval(_mpProgressTimer);
    _mpProgressTimer = setInterval(function(){
      if(!audio) return;
      mpUpdateUI(audio);
      if(audio.ended){
        clearInterval(_mpProgressTimer);
        var pi = document.getElementById('mp-play-icon');
        var pa = document.getElementById('mp-pause-icon');
        var mp = document.getElementById('musicPlayer');
        if(pi) pi.style.display = '';
        if(pa) pa.style.display = 'none';
        if(mp) mp.classList.remove('playing');
      }
    }, 300);
  }

  window.mpToggle = function(){
    var audio = document.getElementById('bookAudio');
    var mp    = document.getElementById('musicPlayer');
    var pi    = document.getElementById('mp-play-icon');
    var pa    = document.getElementById('mp-pause-icon');
    if(!audio) return;
    if(audio.paused){
      audio.play().catch(function(){});
      if(pi) pi.style.display = 'none';
      if(pa) pa.style.display = '';
      if(mp) mp.classList.add('playing');
      mpStartProgress(audio);
    } else {
      audio.pause();
      if(pi) pi.style.display = '';
      if(pa) pa.style.display = 'none';
      if(mp) mp.classList.remove('playing');
    }
  };

  window.mpPrev = function(){
    var audio = document.getElementById('bookAudio');
    if(!audio) return;
    audio.currentTime = Math.max(0, audio.currentTime - 10);
    mpUpdateUI(audio);
  };

  window.mpNext = function(){
    var audio = document.getElementById('bookAudio');
    if(!audio) return;
    audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 10);
    mpUpdateUI(audio);
  };

  // ── Live clock for scan screen ──────────────────────
  function updateScanClock(){
    var now = new Date();
    var h = now.getHours(), m = now.getMinutes();
    var ap = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    var time = h + ':' + (m < 10 ? '0' : '') + m;
    var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var dateStr = DAYS[now.getDay()] + ', ' + now.getDate() + ' ' + MONS[now.getMonth()];
    var st = document.getElementById('scanUI-time');
    var sd = document.getElementById('scanUI-date');
    var mp = document.getElementById('mp-statusbar-time');
    if(st) st.textContent = time + ' ' + ap;
    if(sd) sd.textContent = dateStr;
    if(mp) mp.textContent = time;
  }
  updateScanClock();
  setInterval(updateScanClock, 1000);

  document.addEventListener('DOMContentLoaded', function(){
    var bar = document.getElementById('mp-progress-bar');
    if(bar){
      bar.addEventListener('click', function(e){
        var audio = document.getElementById('bookAudio');
        if(!audio || !audio.duration) return;
        var rect = bar.getBoundingClientRect();
        var pct  = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        audio.currentTime = pct * audio.duration;
        mpUpdateUI(audio);
      });
    }
  });
</script>

<script>
/* Mobile — vertical ant-walker v3 */
(function(){
  if(window.innerWidth>=768) return;
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var cv=document.createElement('canvas');
  cv.style.position='fixed';cv.style.top='0';cv.style.left='0';
  cv.style.width='100%';cv.style.height='100%';
  cv.style.zIndex='10001';cv.style.pointerEvents='none';
  document.body.appendChild(cv);
  var ctx=cv.getContext('2d');
  var dpr=Math.min(window.devicePixelRatio||1,2);
  function resize(){
    cv.width=Math.round(window.innerWidth*dpr);
    cv.height=Math.round(window.innerHeight*dpr);
    cv.style.width=window.innerWidth+'px';
    cv.style.height=window.innerHeight+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize(); window.addEventListener('resize',resize);
  var INK='#241F1A',ANT_SCALE=1.6;
  var SDL={x:0.283,y:-0.958};
  function drawAnt(x,y,angle,legPhase){
    var dropPx=2.0*ANT_SCALE;
    var sx=x+SDL.x*dropPx,sy=y-SDL.y*dropPx;
    ctx.save();
    try{ctx.filter='blur(1.4px)';}catch(e){}
    ctx.fillStyle='rgba(20,17,13,0.30)';
    ctx.beginPath();ctx.ellipse(sx,sy,4.3*ANT_SCALE,2.0*ANT_SCALE,0,0,Math.PI*2);
    ctx.fill();ctx.restore();
    ctx.save();
    ctx.translate(x,y);ctx.rotate(angle);ctx.scale(ANT_SCALE,ANT_SCALE);
    ctx.strokeStyle=INK;ctx.fillStyle=INK;ctx.lineCap='round';
    ctx.lineWidth=0.62;
    [{ox:2.0,s:1,t:0},{ox:0.2,s:1,t:1},{ox:-1.6,s:1,t:0},
     {ox:2.0,s:-1,t:1},{ox:0.2,s:-1,t:0},{ox:-1.6,s:-1,t:1}].forEach(function(l){
      var ph=legPhase+(l.t?Math.PI:0);
      var sw=Math.sin(ph)*2.1,li=Math.max(0,Math.cos(ph))*0.5;
      ctx.beginPath();ctx.moveTo(l.ox,l.s*1.05);
      ctx.quadraticCurveTo(l.ox+sw*0.45,l.s*(2.7+li*0.4),l.ox+sw*1.15,l.s*5.3);
      ctx.stroke();
    });
    ctx.lineWidth=0.45;
    var wig=Math.sin(legPhase*0.45)*0.35;
    ctx.beginPath();
    ctx.moveTo(3.7,-0.55);ctx.quadraticCurveTo(4.6,-1.3,5.6,-1.9+wig);
    ctx.moveTo(3.7,0.55);ctx.quadraticCurveTo(4.6,1.3,5.6,1.9-wig);
    ctx.stroke();
    ctx.beginPath();ctx.ellipse(4.0,0,1.15,1.05,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(1.5,0,1.55,1.25,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-0.65,0,0.55,0.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-3.3,0,2.9,1.95,0,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
  function angleLerp(a,b,t){
    var d=((b-a+Math.PI)%(Math.PI*2))-Math.PI;
    if(d<-Math.PI)d+=Math.PI*2;return a+d*t;
  }
  function sampleHistory(hist,tgt){
    if(!hist.length)return null;
    if(tgt<=hist[0].t)return hist[0];
    var last=hist[hist.length-1];
    if(tgt>=last.t)return last;
    for(var i=1;i<hist.length;i++){
      if(hist[i].t>=tgt){
        var a=hist[i-1],b=hist[i],span=b.t-a.t,fr=span>0?(tgt-a.t)/span:0;
        return{x:a.x+(b.x-a.x)*fr,y:a.y+(b.y-a.y)*fr,
               heading:angleLerp(a.heading,b.heading,fr),
               legPhase:a.legPhase+(b.legPhase-a.legPhase)*fr};
      }
    }
    return last;
  }
  function pickWalk(){
    var w=window.innerWidth,h=window.innerHeight;
    var leftSide=Math.random()<0.5;
    var cw=Math.min(w*0.814,341),cEdge=(w-cw)/2;var baseX=leftSide?Math.round(cEdge):Math.round(w-cEdge);
    var xRange=20,cMin=baseX-xRange,cMax=baseX+xRange;
    var x=baseX+(Math.random()-0.5)*xRange*2;
    var dir=Math.random()<0.5?1:-1,y=dir>0?-34:h+34;
    var bh=dir>0?Math.PI/2:-Math.PI/2;
    var cr=Math.random(),ac=cr<0.45?1:cr<0.72?2:3;
    var spd=58+Math.random()*28,fols=[],cum=0;
    for(var fi=1;fi<ac;fi++){cum+=(22+Math.random()*18)/spd;fols.push({delay:cum});}
    return{x:x,y:y,dir:dir,cMin:cMin,cMax:cMax,
           speed:spd,heading:bh,headingOffset:0,
           wF1:0.32+Math.random()*0.25,wP1:Math.random()*Math.PI*2,
           wF2:0.78+Math.random()*0.5,wP2:Math.random()*Math.PI*2,
           followers:fols,history:[],legPhase:0,t:0};
  }
  var ant=null,idleUntil=performance.now()+800,lastTime=performance.now();
  function tick(now){
    var dt=Math.min((now-lastTime)/1000,0.05);lastTime=now;
    ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
    if(!ant){
      if(now>=idleUntil)ant=pickWalk();
    }else{
      ant.t+=dt;
      var h=window.innerHeight;
      var bfwd=ant.dir>0?Math.PI/2:-Math.PI/2;
      var mid=(ant.cMin+ant.cMax)/2,half=(ant.cMax-ant.cMin)/2;
      var normP=half>0?(ant.x-mid)/half:0;
      var bOff=normP*ant.dir*0.9;
      var mean=0.35*Math.sin(ant.t*ant.wF1+ant.wP1)+0.22*Math.sin(ant.t*ant.wF2+ant.wP2);
      var desOff=Math.max(-0.75,Math.min(0.75,bOff+mean));
      ant.headingOffset+=(desOff-ant.headingOffset)*Math.min(1,dt*2);
      ant.heading=bfwd+ant.headingOffset;
      ant.x+=Math.cos(ant.heading)*ant.speed*dt;
      ant.y+=Math.sin(ant.heading)*ant.speed*dt;
      ant.x=Math.max(ant.cMin,Math.min(ant.cMax,ant.x));
      ant.legPhase+=dt*(8+ant.speed*0.35);
      ant.history.push({t:ant.t,x:ant.x,y:ant.y,heading:ant.heading,legPhase:ant.legPhase});
      var maxD=ant.followers.length?ant.followers[ant.followers.length-1].delay:0;
      while(ant.history.length>2&&ant.history[1].t<ant.t-maxD-0.5)ant.history.shift();
      var lExit=ant.dir>0?ant.y>h+40:ant.y<-40;
      if(!lExit)drawAnt(ant.x,ant.y,ant.heading,ant.legPhase);
      ant.followers.forEach(function(f){
        var sT=ant.t-f.delay;if(sT<0)return;
        var s=sampleHistory(ant.history,sT);
        if(!s||(ant.dir>0?s.y>h+40:s.y<-40))return;
        drawAnt(s.x,s.y,s.heading,s.legPhase);
      });
      var trST=ant.t-maxD,trExit=false;
      if(maxD===0){trExit=lExit;}
      else if(trST>=0){var tr=sampleHistory(ant.history,trST);trExit=!!tr&&(ant.dir>0?tr.y>h+40:tr.y<-40);}
      if((trST>=0&&trExit)||ant.t>60+maxD){ant=null;idleUntil=now+(5000+Math.random()*7000);}
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
